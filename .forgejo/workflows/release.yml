# Generated by Vidocq/ci/release-maven/bootstrap-workflows.sh
# Re-run that script if the project's io.vidocq.* deps change.
#
# Manually adapted from the bootstrap template:
#   The Vidocq/ci action repo is mirrored to GitHub at vidocq-stack/ci to
#   sidestep Codeberg's burst-clone rate-limiting (HTTP 504). That mirror is
#   PRIVATE, so we cannot `uses: https://github.com/vidocq-stack/ci/release-maven@v1`
#   directly (Forgejo runner has no GitHub credentials). Instead we use a
#   second `actions/checkout` to pull the mirror into a sub-dir with the
#   MYGITHUB_MIRROR_TOKEN secret, and call the action by relative path.
#   The sub-dir name `.ci-action/` is listed in .gitignore so the release
#   precheck (clean working tree) and release:prepare commits ignore it.
name: release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 0.1.0). Without -SNAPSHOT."
        required: true
      next_dev_version:
        description: "Next dev version (e.g. 0.2.0-SNAPSHOT). Must end with -SNAPSHOT."
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vidocq-parent
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      - name: Checkout Vidocq/ci action (from private GitHub mirror)
        uses: actions/checkout@v4
        with:
          repository: vidocq-stack/ci
          ref: v1
          path: .ci-action
          token: ${{ secrets.MYGITHUB_MIRROR_TOKEN }}

      - name: Run release pipeline
        uses: ./.ci-action/release-maven
        with:
          release-version:  ${{ inputs.release_version }}
          next-dev-version: ${{ inputs.next_dev_version }}
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          gpg-private-key:  ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase:   ${{ secrets.GPG_PASSPHRASE }}
          gpg-key-id:       ${{ secrets.GPG_KEY_ID }}
